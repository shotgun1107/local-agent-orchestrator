    depends_on: [R07]
    inputs: [{path: "tools/benchmark-runner/src/benchmark_runner/routing_suite.py"}, {path: "tools/benchmark-runner/src/benchmark_runner/s2_policy.py"}]
    read_scope: ["README.md", "profile-r/requirements/**", "benchmark_checks/check_profile_r.py", "benchmarks/suites/sdk-routing-v1/**", "tools/benchmark-runner/src/benchmark_runner/**"]
    write_scope: ["tools/benchmark-runner/src/benchmark_runner/adapter.py", "tools/benchmark-runner/src/benchmark_runner/routing_live.py", "tools/benchmark-runner/src/benchmark_runner/routing_suite.py", "tools/benchmark-runner/src/benchmark_runner/sdk_cells.py"]
