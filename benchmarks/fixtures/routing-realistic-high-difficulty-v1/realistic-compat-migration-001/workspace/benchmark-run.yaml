    inputs: [{path: "tools/benchmark-runner/src/benchmark_runner/routing_live.py"}, {path: "tools/benchmark-runner/src/benchmark_runner/s2_policy.py"}]
    read_scope: ["README.md", "profile-r/requirements/**", "benchmark_checks/check_profile_r.py", "benchmarks/fixtures/routing-v1/intermediate/**", "tools/benchmark-runner/src/benchmark_runner/**"]
    write_scope: ["tools/benchmark-runner/src/benchmark_runner/routing_live.py", "tools/benchmark-runner/src/benchmark_runner/routing_suite.py", "tools/benchmark-runner/src/benchmark_runner/s2_posthoc.py", "tools/benchmark-runner/src/benchmark_runner/sdk_pilot.py"]
    capability_profile: code_change
    workspace_mode: shared_serial_write
    own_check: r09_contract
    approval: none
  - key: R10
    goal: "Implement sealed S2 export, verification, and deterministic tamper rejection without changing S1 meanings."
    completion_criteria:
      - {id: R10C1, text: "Create-to-seal export/verify passes and every declared tamper is rejected.", check_names: [r10_contract]}
    depends_on: [R09]
    inputs: [{path: "tools/benchmark-runner/src/benchmark_runner/routing_suite.py"}, {path: "tools/benchmark-runner/src/benchmark_runner/s2_posthoc.py"}]
    read_scope: ["README.md", "profile-r/requirements/**", "benchmark_checks/check_profile_r.py", "benchmarks/suites/sdk-routing-v1/**", "benchmarks/fixtures/routing-v1/intermediate/**", "tools/benchmark-runner/src/benchmark_runner/**"]
    write_scope: ["benchmarks/posthoc-checks/sdk-routing-v1/s2/checkers/**", "tools/benchmark-runner/src/benchmark_runner/routing_live.py", "tools/benchmark-runner/src/benchmark_runner/routing_suite.py", "tools/benchmark-runner/src/benchmark_runner/s2_posthoc.py"]
