    completion_criteria:
      - {id: R07C1, text: "Reserve and routing decisions are isolated, capped, deterministic, and reject invalid inputs.", check_names: [r07_contract]}
    depends_on: [R06]
    inputs: [{path: "benchmarks/suites/sdk-routing-v1/stages/s2-intermediate.yaml"}, {path: "tools/benchmark-runner/src/benchmark_runner/routing_suite.py"}]
    read_scope: ["README.md", "profile-r/requirements/**", "benchmark_checks/check_profile_r.py", "benchmarks/suites/sdk-routing-v1/**", "tools/benchmark-runner/src/benchmark_runner/**"]
    write_scope: ["tools/benchmark-runner/src/benchmark_runner/s2_policy.py"]
    capability_profile: code_change
    workspace_mode: shared_serial_write
    own_check: r07_contract
    approval: none
  - key: R08
    goal: "Connect S2 to the existing create, status, and run-next lifecycle without creating an S2-only Controller or runtime."
    completion_criteria:
