schema_version: 1
status: frozen_before_execution
frozen_at: "2099-08-06"
fixtures:
  - id: sequential-code-change
    path: benchmarks/fixtures/sequential-code-change
    commit: dd8044b8818a4ca7b6af281fec5f8992bdd4cd43
    git_tree: 7593579d0094e6254563127ae9f0d3508b8dc748
    success_check: acceptance
  - id: sequential-document
    path: benchmarks/fixtures/sequential-document
    commit: dd8044b8818a4ca7b6af281fec5f8992bdd4cd43
    git_tree: 84879dd6db89bb65ae8422f0d1932a102da0a2e9
    success_check: acceptance
variants: [b0, b1]
repetitions: 3
model:
  allowed: gpt-5.6-terra
  auth_method: chatgpt
budgets:
  max_turns_per_run: 8
  max_attempts_per_task: 2
  task_timeout_seconds: 900
  stop_on_unexplained_failure: true
human_intervention:
  b0: initial_T1_prompt_then_one_fixed_prompt_for_each_following_task
  b1: start_command_only_unless_run_blocks
  count_rule: every_manual_task_prompt_correction_retry_or_recovery_command
  task_prompt_evidence: ordered_task_key_and_prompt_sha256
metrics:
  - check_success
  - manual_copy_or_relay_count
  - manual_recovery_count
  - manual_recovery_seconds
  - wall_clock_seconds
  - session_count
  - turn_count
  - attempt_count
  - token_usage_when_measured
  - errors_found_by_automatic_checks
  - errors_found_by_human_after_pass
  - orchestrator_debugging_seconds
unknown_usage_rule: record_unknown_and_do_not_impute_zero
failure_rule: do_not_drop_failed_or_interrupted_repetitions
