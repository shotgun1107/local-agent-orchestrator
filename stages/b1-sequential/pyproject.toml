[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "local-agent-orchestrator-b1"
version = "0.1.0"
description = "B1 sequential local Codex session orchestrator reference implementation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "local-agent-orchestrator contributors" }]
dependencies = [
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
codex = ["openai-codex==0.144.4"]
dev = ["pytest>=8,<9"]
all = ["openai-codex==0.144.4", "pytest>=8,<9"]

[project.scripts]
lao = "orchestrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.hatch.build.targets.wheel.force-include]
"templates/project-pack/.orchestrator" = "orchestrator/_project_pack"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "live: requires an authenticated Codex session and consumes plan or API usage",
]
