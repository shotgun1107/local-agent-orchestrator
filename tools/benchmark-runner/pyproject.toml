[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "local-agent-orchestrator-benchmark-runner"
version = "0.1.0"
description = "Neutral benchmark runner for local agent orchestrator stages"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "local-agent-orchestrator contributors" }]
dependencies = ["pydantic>=2,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
lao-bench = "benchmark_runner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark_runner"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
